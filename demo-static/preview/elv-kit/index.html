<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <meta name="robots" content="noindex, nofollow">
    <title>Демо: Elv Kit — Elv Kit</title>
    <link rel="icon" href="/themes/elv-studio/assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/themes/elv-studio/assets/css/preview.css?v=20261121-1">
</head>
<body class="preview-body">

<div class="preview preview--page" data-preview data-preview-mode="page" data-device="desktop">
    <div class="preview__bar">
        <div class="preview__left">
            <a class="preview__brand" href="/">Elv<span>Studio</span></a>
            <label class="preview__select">
                <span class="preview__label">Продукт</span>
                <select data-preview-select aria-label="Продукт">
                                            <option
                            value="/preview/elv-kit/"
                            data-src="/"
                            data-order="/order/?product=elv-kit"
                            data-preview-url="/preview/elv-kit/"
                            selected>
                            Elv Kit
                        </option>
                                            <option
                            value="/preview/booking/"
                            data-src="/booking/"
                            data-order="/order/?product=booking"
                            data-preview-url="/preview/booking/"
                            >
                            Онлайн-запись
                        </option>
                                            <option
                            value="/preview/shop/"
                            data-src="/order/"
                            data-order="/order/?product=shop"
                            data-preview-url="/preview/shop/"
                            >
                            Заказы и оплата
                        </option>
                                            <option
                            value="/preview/feedback/"
                            data-src="/feedback/"
                            data-order="/order/?product=feedback"
                            data-preview-url="/preview/feedback/"
                            >
                            Обратная связь
                        </option>
                                            <option
                            value="/preview/blog/"
                            data-src="/blog/"
                            data-order="/order/?product=blog"
                            data-preview-url="/preview/blog/"
                            >
                            Блог
                        </option>
                                    </select>
            </label>
        </div>

        <div class="preview__devices" role="group" aria-label="Размер экрана">
            <button type="button" class="preview__device is-active" data-preview-device="desktop" aria-pressed="true" title="Десктоп">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            </button>
            <button type="button" class="preview__device" data-preview-device="tablet" aria-pressed="false" title="Планшет">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M12 18h.01"/></svg>
            </button>
            <button type="button" class="preview__device" data-preview-device="mobile" aria-pressed="false" title="Смартфон">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 18h.01"/></svg>
            </button>
        </div>

        <div class="preview__right">
            <a class="preview__buy" data-preview-buy href="/order">Купить</a>
                            <a class="preview__book" href="/booking?service=demo-tour">Показ админки</a>
                                    <a class="preview__open" data-preview-open href="/" target="_blank" rel="noopener">Без рамки</a>
        </div>
    </div>

    <div class="preview__stage">
        <iframe class="preview__frame preview__frame--desktop" data-preview-frame src="/" title="Демо Elv Kit" loading="eager"></iframe>
    </div>
</div><script src="/themes/elv-studio/assets/js/preview.js?v=20261121-1" defer></script>
<style>#elv-demo-bar{position:relative;z-index:80;background:#0b1220;color:#dfe6f5;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:9px 16px;text-align:center}#elv-static-note{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:#0b1220;color:#fff;padding:12px 18px;border-radius:12px;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;max-width:90vw;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35)}#elv-static-note.is-visible{opacity:1;transform:translateX(-50%) translateY(0)}</style><script>
(function () {
    window.ELV_STATIC_DEMO = true;

    var note = function (text) {
        var box = document.getElementById('elv-static-note');

        if (!box) {
            box = document.createElement('div');
            box.id = 'elv-static-note';
            box.setAttribute('role', 'status');
            document.body.appendChild(box);
        }

        box.textContent = text;
        box.classList.add('is-visible');
        window.clearTimeout(box.elvTimer);
        box.elvTimer = window.setTimeout(function () {
            box.classList.remove('is-visible');
        }, 6000);
    };

    document.addEventListener('click', function (event) {
        var node = event.target instanceof Element ? event.target : null;

        if (!node) {
            return;
        }

        var order = node.closest('a[href*="/order?"], a[href*="/order/?"]');

        if (order) {
            event.preventDefault();
            event.stopImmediatePropagation();
            note('Оформление заказа доступно в полной версии на PHP-хостинге.');
            return;
        }

        if (node.closest('[data-chat-open]')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            note('Консультант доступен в полной версии на PHP-хостинге.');
            return;
        }

        if (node.closest('a[href*="?tag="]')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            note('Фильтр по тегам доступен в полной версии на PHP-хостинге.');
        }
    }, true);

    document.addEventListener('submit', function (event) {
        event.preventDefault();
        event.stopImmediatePropagation();

        var form = event.target;

        if (form instanceof Element && form.matches('form[role="search"]:not([data-static-search])')) {
            note('Поиск по статьям доступен в полной версии на PHP-хостинге.');
            return;
        }

        note('Формы отключены в статической демо-версии.');
    }, true);
})();
</script></body>
</html>
