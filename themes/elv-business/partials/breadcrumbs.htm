{% if crumbs is defined and crumbs|length > 1 %}
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
        {% for crumb in crumbs %}
            {% if not loop.last %}
                <a href="{{ crumb.url }}">{{ crumb.name }}</a>
                <span aria-hidden="true">/</span>
            {% else %}
                <span aria-current="page">{{ crumb.name }}</span>
            {% endif %}
        {% endfor %}
    </nav>
{% endif %}
