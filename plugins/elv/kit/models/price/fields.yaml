fields:
    plan:
        label: 'Тариф'
        type: dropdown
        span: left
        required: true
        options: getPlanOptions
        comment: 'Ключ тарифа неизменен: с него считаются цены и лицензии. После сохранения версии тариф не меняется — создайте новую версию.'
    price_cents:
        label: 'Цена, центы'
        type: number
        span: right
        required: true
        comment: '7900 = $79. Формат подписи берётся из валюты настроек. После сохранения цена не меняется — создайте новую версию.'
    valid_from:
        label: 'Действует с'
        type: datepicker
        span: left
        required: true
        mode: date
        comment: 'С этой даты цена показывается на /pricing/ и в калькуляторе. После сохранения дата не меняется — создайте новую версию.'
    valid_to:
        label: 'Действует по'
        type: datepicker
        span: right
        mode: date
        comment: 'Пусто — бессрочно. Заполняйте, когда цена заменена новой версией.'
    is_active:
        label: 'Версия активна'
        type: switch
        default: true
        span: left
    note:
        label: 'Заметка'
        type: text
        span: right
        comment: 'Почему цена изменилась: акция, новая ставка, исправление.'
        attributes:
            maxlength: 255
    created_by:
        label: 'Кто записал'
        type: number
        span: left
        disabled: true
        comment: 'ID администратора; заполняется автоматически при создании версии.'
