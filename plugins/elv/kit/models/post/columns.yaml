columns:
    id:
        label: '#'
        type: number
        sortable: true
    title:
        label: 'Заголовок'
        searchable: true
    category:
        label: 'Категория'
        relation: category
        select: name
    audience:
        label: 'Аудитория'
        type: selectable
        options:
            business: 'Для бизнеса'
            tech: 'Технический'
    published_at:
        label: 'Публикация'
        type: datetime
        sortable: true
    is_published:
        label: 'Опубликована'
        type: switch
    reading_time:
        label: 'Мин.'
        type: number
