tabs:
    fields:
        brand_name:
            label: 'Название продукта'
            tab: 'Бренд'
            span: left
            default: 'Elv Kit'
        brand_tagline:
            label: 'Слоган'
            tab: 'Бренд'
            span: right
            default: 'Модульный конструктор сайтов на October CMS'
        brand_description:
            label: 'Описание для микроразметки'
            tab: 'Бренд'
            type: textarea
            size: small
            default: 'Elv Kit — тема, модули и демо-данные для October CMS 4.x.'
        brand_subtitle:
            label: 'Подпись под логотипом'
            tab: 'Бренд'
            span: left
            comment: 'Необязательная строка рядом с названием: например, название студии или продукта. Пусто — подписи нет.'
        legal_name:
            label: 'Продавец в документах'
            tab: 'Бренд'
            span: right
            comment: 'Юридическое лицо или ИП для оферты, политики и контактов. Пусто — подставляется название продукта.'

        menu_products_label:
            label: 'Название раздела'
            tab: 'Меню'
            span: left
            default: 'Продукты'
            comment: 'Пункт в шапке сайта. Пусто — «Продукты».'
        menu_products:
            label: 'Разработки в меню'
            tab: 'Меню'
            type: textarea
            size: small
            comment: 'Название | адрес | подпись — по одной строке. Подпись необязательна, адрес может быть внешним. Пусто — в меню «Elv Kit» и «Шаблон».'

        email:
            label: 'E-mail'
            tab: 'Контакты'
            span: left
            default: 'sales@example.com'
        phone:
            label: 'Телефон'
            tab: 'Контакты'
            span: right
        telegram:
            label: 'Telegram'
            tab: 'Контакты'
            comment: 'Полная ссылка https://t.me/… — иначе пусто.'
            span: left
        whatsapp:
            label: 'WhatsApp'
            tab: 'Контакты'
            comment: 'Номер в международном формате или ссылка wa.me — пусто, если канал не нужен.'
            span: right
        github_url:
            label: 'GitHub'
            tab: 'Контакты'
            span: left
        docs_url:
            label: 'Документация'
            tab: 'Контакты'
            span: right
            default: '/docs/'
        demo_url:
            label: 'Демо-стенд'
            tab: 'Контакты'
            span: left
            default: '/demo/'
        telegram_bot_token:
            label: 'Telegram: токен бота'
            tab: 'Поддержка'
            type: password
            span: left
            comment: 'Токен от @BotFather. Лучше хранить в .env (ELV_TELEGRAM_BOT_TOKEN). Пусто — Telegram выключен, обращения работают в кабинете и админке.'
        telegram_chat_id:
            label: 'Telegram: chat_id'
            tab: 'Поддержка'
            span: right
            comment: 'Чат поддержки. Напишите боту, откройте getUpdates и возьмите chat.id. Можно задать в .env (ELV_TELEGRAM_CHAT_ID).'
        telegram_webhook_secret:
            label: 'Telegram: секрет вебхука'
            tab: 'Поддержка'
            type: password
            comment: 'Строка 16–64 символа, латиница, цифры, дефис и подчёркивание. Вебхук: /telegram/webhook/<секрет>. Пусто — ChatOps выключен. Можно задать в .env (ELV_TELEGRAM_WEBHOOK_SECRET).'

        chat_enabled:
            label: 'Консультант в виджете'
            tab: 'Виджет'
            type: switch
            default: true
            comment: 'Отвечает по базе знаний сайта: тарифы, модули, установка, оплата. Внешних сервисов нет.'
        chat_services:
            label: 'Услуги сайта для консультанта'
            tab: 'Виджет'
            type: textarea
            size: small
            comment: 'По одной услуге в строке. Пусто — консультант не перечисляет услуги, а предлагает написать в форме обратной связи.'
        chat_services_url:
            label: 'Ссылка на страницу услуг'
            tab: 'Виджет'
            comment: 'Например, /services/. Пусто — ссылка в ответе не показывается.'

        currency:
            label: 'Валюта'
            tab: 'Продажи'
            type: dropdown
            default: USD
            options:
                USD: USD
                BYN: BYN
                RUB: RUB
        payments_mode:
            label: 'Режим оплаты'
            tab: 'Продажи'
            type: dropdown
            default: auto
            comment: 'auto — mock вне production и только без ключей; live — только шлюз; mock — заказ помечается оплаченным сразу (запрещено в production).'
            options:
                auto: 'Авто (безопасно)'
                live: 'Только шлюз'
                mock: 'Mock (демо)'
        plan_single_label:
            label: 'Тариф 1: название'
            tab: 'Продажи'
            span: left
            default: 'Один сайт'
            comment: 'Ключ single — один сайт, поддержка 30 дней. Название видно на витрине, в калькуляторе и в заказе.'
        plan_single_on:
            label: 'Тариф 1: продаётся'
            tab: 'Продажи'
            type: switch
            span: right
            default: true
        plan_multi_label:
            label: 'Тариф 2: название'
            tab: 'Продажи'
            span: left
            default: 'До 5 сайтов'
            comment: 'Ключ multi — до 5 сайтов, приоритетная поддержка 90 дней.'
        plan_multi_on:
            label: 'Тариф 2: продаётся'
            tab: 'Продажи'
            type: switch
            span: right
            default: true
        plan_extended_label:
            label: 'Тариф 3: название'
            tab: 'Продажи'
            span: left
            default: 'Без ограничений'
            comment: 'Ключ extended — без ограничений по сайтам, поддержка 1 год. Выключенный тариф не показывается и не принимается в заказе; цены и лицензии по его ключу остаются.'
        plan_extended_on:
            label: 'Тариф 3: продаётся'
            tab: 'Продажи'
            type: switch
            span: right
            default: true
        order_notify_email:
            label: 'Копия заказа'
            tab: 'Продажи'
            comment: 'Адрес администратора для писем о заказах и бронях.'
            default: 'sales@example.com'
        demo_links:
            label: 'Дополнительные демо'
            tab: 'Продажи'
            type: textarea
            size: small
            comment: 'Название | адрес демо | адрес страницы | подпись — по одной строке. Адрес демо может быть внешним, страница и подпись необязательны. Пусто — на /demo/ только продукты из каталога.'
        download_daily_limit:
            label: 'Скачиваний архива в сутки'
            tab: 'Продажи'
            default: 5
            comment: 'Сколько раз покупатель может скачать оплаченный ZIP с одного заказа за сутки. 0 — без ограничения. Внутри архива лежит LICENSE_OWNER.txt с номером заказа.'
        yookassa_shop_id:
            label: 'ЮKassa: shopId'
            tab: 'Продажи'
            span: left
        yookassa_secret:
            label: 'ЮKassa: секретный ключ'
            tab: 'Продажи'
            type: password
            span: right
            comment: 'Лучше хранить в .env (YOOKASSA_SECRET). Значение в БД — запасной вариант.'
        stripe_secret:
            label: 'Stripe: secret key'
            tab: 'Продажи'
            type: password
            span: left
        stripe_webhook_secret:
            label: 'Stripe: webhook secret'
            tab: 'Продажи'
            type: password
            span: right

        calculator_enabled:
            label: 'Показывать калькулятор'
            tab: 'Калькулятор'
            type: switch
            default: true
            comment: 'Выключенный калькулятор остаётся страницей, но вместо мастера показывает форму брифа и ссылку на цены.'
        prices_updated_at:
            label: 'Дата актуальности цен (запасная)'
            tab: 'Калькулятор'
            default: '17.11.2026'
            comment: 'Показывается, только если в разделе «Прайс» нет активных версий. Основная дата считается из прайса.'
        calculator_hosting_note:
            label: 'Пометка про хостинг'
            tab: 'Калькулятор'
            type: textarea
            size: small
            default: 'Хостинг и домен оплачиваются провайдеру напрямую. Мы не добавляем наценку и не выдаём чужой хостинг за свой.'
        calculator_support_note:
            label: 'Пометка про поддержку'
            tab: 'Калькулятор'
            type: textarea
            size: small
            default: 'Поддержка уже входит в тариф на указанный срок. Продление после него считается отдельно по объёму работ.'

        license_api_token:
            label: 'Токен API лицензий'
            tab: 'Лицензии'
            type: password
            comment: 'Необязательный общий токен для POST /api/v1/license/activate. Пусто — проверяется только ключ.'
        license_stats_public:
            label: 'Показывать счётчик активаций'
            tab: 'Лицензии'
            type: switch
            default: true

        analytics_google:
            label: 'Google Analytics 4 (G-…)'
            tab: 'SEO и аналитика'
            span: left
            comment: 'Скрипт грузится лениво после первого взаимодействия — PageSpeed не страдает.'
        analytics_yandex:
            label: 'Яндекс Метрика (номер)'
            tab: 'SEO и аналитика'
            span: right
        metrika_webvisor:
            label: 'Вебвизор'
            tab: 'SEO и аналитика'
            type: switch
            default: false
        sitemap_lastmod:
            label: 'Дата обновления контента'
            tab: 'SEO и аналитика'
            comment: 'Необязательная дата для lastmod статических страниц в sitemap.xml: 2026-11-23 или 23.11.2026. Пусто — lastmod у страниц не выводится, а у статей и товаров дата берётся из updated_at.'

        faq_items:
            label: 'Общий блок FAQ'
            tab: 'FAQ'
            type: textarea
            size: large
            comment: 'Вопрос | Ответ, по одной паре в строке. Пусто — блок FAQ на главной и в тарифах не показывается.'
        faq_calculator_items:
            label: 'FAQ калькулятора'
            tab: 'FAQ'
            type: textarea
            size: large
            comment: 'Вопрос | Ответ, по одной паре в строке. Пусто — блока на странице калькулятора нет.'
        faq_services_items:
            label: 'FAQ страницы услуг'
            tab: 'FAQ'
            type: textarea
            size: large
            comment: 'Вопрос | Ответ, по одной паре в строке. Пусто — блока на странице услуг нет.'
        faq_seo_items:
            label: 'FAQ страницы SEO'
            tab: 'FAQ'
            type: textarea
            size: large
            comment: 'Вопрос | Ответ, по одной паре в строке. Пусто — блока на странице SEO нет.'
        faq_post_items:
            label: 'FAQ статей'
            tab: 'FAQ'
            type: textarea
            size: large
            comment: 'Адрес статьи | Вопрос | Ответ, по одной паре в строке. Пусто — у статей нет блока вопросов.'

        booking_services:
            label: 'Услуги для записи'
            tab: 'Запись'
            type: textarea
            size: large
            comment: 'Код | Название | Минут | Цена | Описание | Иконка — по одной услуге в строке. Код латиницей, иконка необязательна. Пусто — страница записи пишет «Запись временно недоступна» и ведёт в контакты.'
        booking_reminder_enabled:
            label: 'Напоминания о записи'
            tab: 'Запись'
            type: switch
            default: false
            comment: 'Письмо клиенту перед визитом. Нужен cron: `php artisan schedule:run` раз в минуту.'
        booking_reminder_hours:
            label: 'За сколько часов'
            tab: 'Запись'
            type: number
            default: 24
            comment: 'От 1 до 72 часов. Пусто — 24.'
        booking_reminder_admin:
            label: 'Напоминать мастеру'
            tab: 'Запись'
            type: switch
            default: false
            comment: 'Письмо администратору на адрес уведомлений из вкладки «Продажи». Расписание — то же, что у клиента.'

        ticket_attachments_enabled:
            label: 'Вложения в обращениях'
            tab: 'Поддержка'
            type: switch
            default: true
            comment: 'Скриншоты и логи: до 3 файлов по 5 МБ, png/jpg/gif/webp/pdf/txt/log/csv/zip. Хранятся вне публичной папки, скачиваются по проверке прав.'
        ticket_quick_replies:
            label: 'Быстрые ответы'
            tab: 'Поддержка'
            type: textarea
            size: large
            comment: 'Название | Текст — по одному шаблону в строке. Пусто — кнопок быстрых ответов в админке нет.'
        ticket_autoclose_days:
            label: 'Автозакрытие обращения'
            tab: 'Поддержка'
            type: number
            default: 5
            comment: 'Столько дней без ответа покупателя после ответа поддержки. 0 — не закрывать. Нужен cron: php artisan schedule:run.'

        qa_enabled:
            label: 'Блок «Вопрос-ответ»'
            tab: 'Вопросы и отзывы'
            type: switch
            default: true
            comment: 'Форма вопроса на страницах продуктов. Вопрос публикуется только после ответа из админки.'
        reviews_enabled:
            label: 'Отзывы покупателей'
            tab: 'Вопросы и отзывы'
            type: switch
            default: true
            comment: 'Одобренные отзывы на страницах продуктов и рейтинг в микроразметке.'
        review_invite_enabled:
            label: 'Приглашать к отзыву'
            tab: 'Вопросы и отзывы'
            type: switch
            default: false
            comment: 'Письмо со ссылкой на отзыв после оплаты. Нужен cron: `php artisan schedule:run` раз в минуту.'
        review_delay_days:
            label: 'Через сколько дней'
            tab: 'Вопросы и отзывы'
            type: number
            default: 7
            comment: 'От 1 до 90 дней после оплаты. Пусто — 7.'

