<h1 style="font:600 18px/1.4 Arial, sans-serif; margin:0 0 12px">Новый вопрос о продукте</h1>
<table cellpadding="0" cellspacing="0" style="font:14px/1.6 Arial, sans-serif">
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Продукт</td><td>{{ question.product }}</td></tr>
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Автор</td><td>{{ question.name }}</td></tr>
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">E-mail</td><td>{{ question.email }}</td></tr>
</table>
<p style="font:14px/1.55 Arial, sans-serif; margin:14px 0 0; white-space:pre-line">{{ question.text }}</p>
<p style="font:14px/1.55 Arial, sans-serif; margin:18px 0 0">
    <a href="{{ question.url }}">Ответить и опубликовать</a>
</p>
<p style="font:13px/1.5 Arial, sans-serif; margin:12px 0 0; color:#5b6472">
    Вопрос появится на сайте только после ответа и модерации.
</p>
