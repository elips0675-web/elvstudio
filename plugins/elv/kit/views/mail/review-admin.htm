<h1 style="font:600 18px/1.4 Arial, sans-serif; margin:0 0 12px">Новый отзыв на модерацию</h1>
<table cellpadding="0" cellspacing="0" style="font:14px/1.6 Arial, sans-serif">
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Продукт</td><td>{{ review.product }}</td></tr>
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Автор</td><td>{{ review.author }}</td></tr>
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Оценка</td><td>{{ review.rating }} из 5</td></tr>
</table>
<p style="font:14px/1.55 Arial, sans-serif; margin:14px 0 0"><b>{{ review.title }}</b></p>
<p style="font:14px/1.55 Arial, sans-serif; margin:6px 0 0; white-space:pre-line">{{ review.text }}</p>
<p style="font:14px/1.55 Arial, sans-serif; margin:18px 0 0">
    <a href="{{ review.url }}">Открыть в админке</a>
</p>
