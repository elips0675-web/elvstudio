<h1 style="font:600 18px/1.4 Arial, sans-serif; margin:0 0 12px">Ответ по обращению {{ ticket.number }}</h1>
<p style="font:14px/1.55 Arial, sans-serif; margin:0 0 10px">Здравствуйте!</p>
<p style="font:14px/1.55 Arial, sans-serif; margin:0 0 10px">
    {{ ticket.author }} ответил(а) на обращение «{{ ticket.subject }}».
</p>
<blockquote style="font:14px/1.55 Arial, sans-serif; margin:0 0 14px; padding:10px 14px; border-left:3px solid #c9d3e6; white-space:pre-line">{{ ticket.body }}</blockquote>
<p style="font:14px/1.55 Arial, sans-serif; margin:0 0 10px">
    <a href="{{ ticket.url }}">Открыть обращение и ответить</a>
</p>
<p style="font:13px/1.5 Arial, sans-serif; margin:0; color:#5b6472">
    Это письмо отправлено по обращению {{ ticket.number }}. Если вопрос решён, обращение можно закрыть в кабинете.
</p>
