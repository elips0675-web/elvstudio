<h1 style="font:600 18px/1.4 Arial, sans-serif; margin:0 0 12px">Новый заказ</h1>
<table cellpadding="0" cellspacing="0" style="font:14px/1.6 Arial, sans-serif">
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Заказ</td><td>{{ order.number }}</td></tr>
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Продукт</td><td>{{ order.product }} — {{ order.plan }}</td></tr>
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Сумма</td><td>{{ order.amount }}</td></tr>
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Имя</td><td>{{ order.customer }}</td></tr>
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">E-mail</td><td>{{ order.email }}</td></tr>
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Телефон</td><td>{{ order.phone }}</td></tr>
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Компания</td><td>{{ order.company }}</td></tr>
</table>
<p style="font:14px/1.55 Arial, sans-serif; margin:14px 0 0">{{ order.comment }}</p>
<p style="margin:16px 0 0">
    <a href="{{ backend }}" style="color:#1c5cf0; font:600 14px/1 Arial, sans-serif">Открыть заказ в админке</a>
</p>
