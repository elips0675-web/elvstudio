<h1 style="font:600 18px/1.4 Arial, sans-serif; margin:0 0 12px">Сообщение с сайта</h1>
<table cellpadding="0" cellspacing="0" style="font:14px/1.6 Arial, sans-serif">
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Имя</td><td>{{ message.name }}</td></tr>
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">E-mail</td><td>{{ message.email }}</td></tr>
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Телефон</td><td>{{ message.phone }}</td></tr>
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Тема</td><td>{{ message.subject }}</td></tr>
    <tr><td style="padding:2px 16px 2px 0; color:#5b6472">Источник</td><td>{{ message.source }}</td></tr>
</table>
<p style="font:14px/1.55 Arial, sans-serif; margin:14px 0 0; white-space:pre-line">{{ message.body }}</p>
